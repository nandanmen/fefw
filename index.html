<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fortune's Weave support planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Radix Colors gray scale: https://www.radix-ui.com/colors. The dark scale applies under .dark on <html>. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@3.0.0/gray.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@3.0.0/gray-dark.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@3.0.0/green.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@3.0.0/green-dark.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@3.0.0/red.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@3.0.0/red-dark.css">
<script>
// Puts .dark or .light on <html>: data-theme="dark|light" wins, otherwise the system setting. Runs before first paint.
(()=>{
  const root = document.documentElement, mq = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => { const t = root.dataset.theme, dark = t ? t==="dark" : mq.matches; root.classList.toggle("dark", dark); root.classList.toggle("light", !dark); };
  apply();
  mq.addEventListener("change", apply);
  new MutationObserver(apply).observe(root, {attributes:true, attributeFilter:["data-theme"]});
})();
</script>
<style>
/* UI colors come from Radix: gray for the interface, green for boons, red for banes and warnings.
   Character colors (PALETTE) stay as they are. Step 11 is Radix's accessible text step; --boon also fills the Boon tag. */
:root{
  --bg:#FFFFFF; --panel:var(--gray-2); --ink:var(--gray-12); --muted:var(--gray-11); --line:var(--gray-6);
  --accent:var(--gray-12); --accent-ink:var(--gray-1); --warn:var(--red-11); --boon:var(--green-11);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root.dark{ --bg:var(--gray-1); color-scheme:dark }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
.routes{display:flex;gap:4px;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg);
  position:sticky;top:0;z-index:2;justify-content:center}
.routes button{border:0;background:none;color:var(--muted);padding:14px 16px;font-weight:600;white-space:nowrap;
  border-bottom:3px solid transparent;margin-bottom:-1px}
.routes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:8px 32px;padding:0 16px}
.layout .wrap{max-width:none;margin:0;padding-left:0;padding-right:0}
.side{position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow-y:auto;padding:20px 0 24px}
.side h2{font-size:1.35rem;margin:0}
.side .hint{margin:2px 0 10px}
.recruits{list-style:none;margin:0;padding:0}
.recruits li{display:flex;align-items:center;gap:4px;border-radius:8px}
.recruits li:hover{background:var(--panel)}
.recruits li:has([aria-current="true"]){background:var(--panel);box-shadow:inset 0 0 0 1px var(--accent)}
.recruits .open{display:grid;grid-template-columns:4px 1fr;gap:0 10px;flex:1;min-width:0;text-align:left;border:0;background:none;
  color:var(--ink);padding:7px 8px;border-radius:8px}
.recruits .toggle{flex:0 0 auto;width:30px;height:30px;margin-right:4px;border:1px solid var(--line);border-radius:50%;
  background:var(--bg);color:var(--ink);font-size:1.1rem;line-height:1;display:grid;place-items:center}
.recruits .toggle:hover{border-color:var(--accent);color:var(--accent)}
.recruits .toggle[aria-pressed="true"]{color:var(--muted)}
.recruits i{grid-row:span 2;border-radius:2px;background:transparent}
.recruits b{font-weight:600}
.recruits span{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sidesearch{position:sticky;top:-20px;margin-top:-20px;padding:20px 0 8px;background:var(--bg);z-index:1}
.sidesearch input{padding:8px 12px;font-size:.9375rem}
#sideMsg{margin:0 0 8px 8px}
@media (max-width:820px){
  .routes{justify-content:flex-start}
  .layout{grid-template-columns:minmax(0,1fr);padding:0}
  .layout .wrap{padding:8px 16px 48px}
  .side{position:static;max-height:none;padding:16px 16px 0}
  .sidesearch{position:static;margin-top:0;padding:0 0 8px}
  .recruits{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .recruits li{flex:0 0 auto;background:var(--panel);border:1px solid var(--line)}
  .recruits .open{flex:0 0 auto}
}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;font-weight:700;margin:0 0 10px;line-height:1.2}
input[type=text],input[type=search]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
::placeholder{color:var(--muted)}
button{font:inherit;cursor:pointer}
.hint{font-size:.875rem;color:var(--muted);margin:6px 0 0}
.hint a{color:var(--accent)}
.msg{font-size:.875rem;color:var(--warn);margin:6px 0 0}
.msg:empty{display:none}
.none{color:var(--muted)}
dl.gifts{margin:0;display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;font-size:.9375rem}
dl.gifts dt{color:var(--muted);font-weight:500}
dl.gifts dd{margin:0}
dl.sups{margin:0;display:grid;grid-template-columns:minmax(8em,auto) 1fr;font-size:.9375rem}
dl.sups dt,dl.sups dd{padding:7px 0;border-bottom:1px solid var(--line);margin:0}
dl.sups dt{padding-right:14px}
dl.sups dt:nth-last-of-type(1),dl.sups dd:last-child{border-bottom:0}
dl.sups button{border:0;background:none;color:var(--ink);font-weight:600;padding:0;display:inline-flex;align-items:center;gap:6px;text-align:left}
dl.sups button:hover{text-decoration:underline}
dl.sups button i{width:4px;height:14px;border-radius:2px;display:block;flex:0 0 auto}
dl.sups .sr{display:inline-block;margin:0 14px 2px 0;font-size:.875rem;color:var(--muted)}
dl.sups .sr b{color:var(--ink);margin-right:4px}
.lshead{margin:0 0 4px}
.lshead h2{font-size:2rem;margin:0}
.mtabs{display:none}
.lssec{margin:24px 0 0}
.lssec>h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.seg{font-family:"Figtree",sans-serif;font-size:.8125rem;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pskill{display:grid;grid-template-columns:6.5em 1fr;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.pskill:last-child{border-bottom:0}
.pskill dt{color:var(--muted);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.pskill dd{margin:0;min-width:0}
.pskill b{display:block}
.pskill p{margin:2px 0 4px;font-size:.9375rem}
.pskill small{color:var(--muted);font-weight:600;font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.growth{display:grid;grid-template-columns:3em 1fr 2.8em;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.growth span{font-size:.875rem;color:var(--muted);font-weight:600}
.growth .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.growth .bar i{display:block;height:100%;background:var(--green-9);border-radius:5px}
.growth em{font-style:normal;text-align:right;font-weight:600}
.gtotal{margin:8px 0 0;font-size:.875rem;color:var(--muted)}
.gtotal b{color:var(--ink)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.sk.boon{border-color:var(--boon)}
.sk h4{margin:0 0 8px;font-size:1rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.tag.boon{background:var(--boon);color:var(--accent-ink)}
.tag.bane{color:var(--warn);border:1px solid var(--warn)}
.ranks{display:grid;grid-template-columns:2.4em 1fr;gap:4px 10px;margin:0;font-size:.9375rem}
.ranks dt{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ranks dd{margin:0;min-width:0}
.sk .none{font-size:.9375rem;margin:0}
.paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.path{border-left:3px solid var(--line);padding:2px 0 2px 12px;min-width:0}
.path b{display:block;margin-bottom:2px}
.path ul{margin:0;padding-left:1.1em;font-size:.9375rem}
.path p{margin:0;font-size:.9375rem}
.path p.na{color:var(--muted)}
.segs{display:inline-flex;gap:6px;flex-wrap:wrap}
.art{display:block;margin:0 0 8px}
.art:last-child{margin-bottom:0}
.art b{font-weight:600}
.tag.rare{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);margin-left:6px;padding:1px 6px;font-size:.625rem;vertical-align:2px;cursor:help}
.art .ad{display:block;font-size:.8125rem;line-height:1.45;color:var(--muted);margin-top:1px}
.art .st{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.art .up{font-style:italic}
.ranks dt{padding-top:1px}
.ranks dt.hit{color:var(--accent)}
.sk h4 .goal{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
/* ---------- unit planner (third column on the Learnsets tab) ---------- */
.layout.three{grid-template-columns:250px minmax(0,1fr) minmax(0,1fr)}
.plan{position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow-y:auto;padding:20px 0 24px}
.plan h2{font-size:1.35rem;margin:0}
.plan h3{font-size:.8125rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px;
  display:flex;justify-content:space-between;align-items:baseline}
.plan h3 small{font-size:.75rem;text-transform:none;letter-spacing:0;font-weight:500}
.plan select{font:inherit;font-size:.875rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;min-width:0}
.lvls{display:grid;grid-template-columns:1fr auto 4.8em;gap:4px 8px;align-items:center;font-size:.875rem}
.lvls label{display:flex;gap:6px;align-items:center;min-width:0}
.lvls label i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.lvls label i.boon{background:var(--boon)}
.lvls label i.bane{border:1.5px solid var(--warn)}
.lvls label.off{color:var(--muted)}
.lvls em{font-style:normal;font-size:.75rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.lvls em.has{color:var(--accent);font-weight:600}
.legend{font-size:.75rem;color:var(--muted);margin:6px 0 0;display:flex;gap:12px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.legend i.boon{background:var(--boon)}
.legend i.bane{border:1.5px solid var(--warn)}
.clslist{list-style:none;margin:0 0 8px;padding:0;counter-reset:cls}
.clslist li{display:grid;grid-template-columns:1.4em 1fr auto;gap:0 6px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line);counter-increment:cls}
.clslist li::before{content:counter(cls);color:var(--muted);font-weight:600;font-size:.8125rem;padding-top:2px;font-variant-numeric:tabular-nums}
.clslist b{font-weight:600;font-size:.9375rem;display:block}
.clslist span{font-size:.75rem;color:var(--muted);display:block;line-height:1.4}
.clsbtns{display:flex;gap:2px}
.clsbtns button{border:1px solid transparent;background:none;color:var(--muted);width:24px;height:24px;border-radius:6px;padding:0;line-height:1}
.clsbtns button:hover:not(:disabled){border-color:var(--line);color:var(--ink)}
.clsbtns button:disabled{opacity:.3;cursor:default}
#planAddCls{width:100%}
.clslist b .st{font-style:normal;font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:4px;vertical-align:1px}
.clslist b .st.ok{color:var(--boon)}
.clslist b .st.no{color:var(--warn)}
.clslist .note{font-style:italic}
.reqs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:3px 0}
.reqs em{font-style:normal;font-size:.6875rem;color:var(--muted)}
.req{font:inherit;font-size:.75rem;font-weight:600;border-radius:999px;padding:1px 8px;border:1px dashed var(--warn);color:var(--warn);background:none;line-height:1.5}
button.req:hover{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.clslist .reqs span{display:inline-block}
.req.ok{border:1px solid color-mix(in srgb,var(--boon) 50%,transparent);color:var(--boon)}
.planarts{font-size:.8125rem;margin:0}
.planarts div{margin:0 0 4px}
.planarts b{font-weight:600;color:var(--muted)}
.plan .clear{margin-top:18px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:.8125rem}
.plan .clear:hover{border-color:var(--warn);color:var(--warn)}
@media (max-width:1110px){
  .layout.three{grid-template-columns:250px minmax(0,1fr)}
  .layout.three .plan{grid-column:2;position:static;max-height:none;border-top:1px solid var(--line);padding-top:20px}
}
@media (max-width:820px){
  .layout.three{grid-template-columns:minmax(0,1fr)}
  .layout.three .plan{grid-column:auto;padding:20px 16px 48px}
  /* Info / Plan tabs under the character name replace the stacked plan column. */
  .mtabs{display:flex;gap:4px;margin:10px 0 0;border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
  .mtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .layout[data-mtab="info"] .plan{display:none}
  .layout[data-mtab="plan"] #lsInfo{display:none}
  .layout[data-mtab="plan"] .wrap{padding-bottom:0}
  .layout[data-mtab="plan"] .plan{border-top:0;padding-top:4px}
  .layout[data-mtab="plan"] .plan>h2{display:none}
}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<nav class="routes" role="tablist" aria-label="Route" id="routes"></nav>
<div class="layout three">
<aside class="side" aria-label="Characters">
  <div class="sidesearch"><input type="search" id="sideQ" placeholder="Search all characters" aria-label="Search all characters" autocomplete="off"></div>
  <p class="hint" id="sideMsg" hidden></p>
  <ol class="recruits" id="recruits"></ol>
</aside>
<div class="wrap">
  <div id="panel-learn">
    <div id="lsView"></div>
  </div>
</div>
<aside class="plan" id="lsPlan" aria-label="Unit plan"></aside>
</div>
<script>
const PALETTE = ["#C4566B","#D9A441","#3E8E7E","#5B6CD6","#B565C9","#E07A3F","#4FA3C7","#8BA33A","#D1608F","#7A6650","#2F6F9F","#C98A2B"];
const TIERS = ["Loved","Liked"];
const KEY = "fw-planner-v2";
const STATS = [["hp","HP"],["str","Str"],["mag","Mag"],["spd","Spd"],["dex","Dex"],["def","Def"],["res","Res"],["lck","Lck"],["cha","Cha"]];
const LINES = [["sword","Sword"],["spear","Spear"],["axe","Axe"],["bow","Bow"],["gauntlet","Gauntlet"],["blackMagic","Black Magic"],
  ["whiteMagic","White Magic"],["authority","Authority"],["infantry","Infantry"],["riding","Riding"],["armor","Armor"],["flying","Flying"]];
const PATHS = [["cai","Cai's path"],["dietrich","Dietrich's path"],["theodora","Theodora's path"],["leda","Leda's path"]];
const ROMAN = ["Prologue","Part I","Part II","Part III"];
const norm = s => s.toLowerCase().replace(/[^a-z]/g,"");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let CHARS = {}, SKILLS = {}, NAMES = [], LOOKUP = {};
// Learnset skill (base name, without +) -> characters who learn it. Built once on load.
let LEARNERS = {};
const RARE_MAX = 3; // learned by this many characters or fewer counts as rare
// Skill ranks in order. The sheet's learnsets start at D; units start at E.
const RANKS = ["E","E+","D","D+","C","C+","B","B+","A","A+","S","S+"];
const rankIdx = r => RANKS.indexOf(r);
// Classes from data/classes.json, in sheet order: [{name, tier, level, renown, partThree, primary, secondary, notes, mastery}].
let CLASSES = [];
const LINE_LABEL = Object.fromEntries(LINES);
// A line the plan doesn't set counts as E, the starting rank.
const meets = (q, ranks) => rankIdx(ranks[q.line] || "E") >= rankIdx(q.rank);
// Primary skills are all required; of the secondary skills, any one is enough.
const skillsMet = (cl, ranks) => (cl.primary||[]).every(q=>meets(q,ranks)) && (!(cl.secondary||[]).length || cl.secondary.some(q=>meets(q,ranks)));
// plans: character -> {ranks:{line:"B"}, classes:["Myrmidon", ...]}
let state = {added:{cai:[],dietrich:[],theodora:[],leda:[]}, route:"cai", plans:{}};
const plan = n => { const p = ((state.plans ||= {})[n] ||= {}); p.ranks ||= {}; p.classes ||= []; return p; };
const isEmptyPlan = p => !p || (!Object.keys(p.ranks||{}).length && !(p.classes||[]).length);
// The roster for the current route: its automatic joiners plus anyone added from the sidebar. Rebuilt on each render.
let ROSTER = [];
let lsBoonOnly = false, lsDetails = true;
// Phone layout only: which of the Info / Plan tabs under the character name is showing.
let lsMobileTab = "info";
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };
const color = n => PALETTE[ROSTER.indexOf(n) % PALETTE.length];

const joinsAutomatically = r => r.renown==null && r.support==null;
function buildRoster(){
  const list = partOneRecruits(state.route);
  const added = (state.added[state.route] ||= []);
  ROSTER = list.filter(({n,r})=>joinsAutomatically(r) || added.includes(n)).map(x=>x.n);
}
function toggleRoster(n){
  const added = state.added[state.route];
  state.added[state.route] = added.includes(n) ? added.filter(m=>m!==n) : [...added, n];
  save(); render();
}

// What a support rank needs besides the support level: the part of the story and any extra conditions.
const supportCond = q => [q.part!=null && ROMAN[q.part], ...q.notes].filter(Boolean).join(", ");

/* ---------- supports (section on the Learnsets tab) ---------- */
// The character's support partners: roster members first, then by name. Each rank shows what it needs.
function supportsHTML(n){
  const sup = CHARS[n].supports || {};
  const names = Object.keys(sup).sort((a,b)=>(ROSTER.includes(b)-ROSTER.includes(a)) || a.localeCompare(b));
  if(!names.length) return `<p class="none">No supports listed.</p>`;
  return `<dl class="sups">${names.map(m=>{
    const inR = ROSTER.includes(m), canOpen = !!CHARS[m];
    const label = `${inR?`<i style="background:${color(m)}"></i>`:""}${esc(m)}`;
    return `<dt>${canOpen?`<button type="button" data-ls="${esc(m)}" title="Open ${esc(m)}'s learnset">${label}</button>`:`<b>${label}</b>`}</dt>
      <dd>${Object.entries(sup[m]).map(([rk,q])=>`<span class="sr"><b>${esc(rk)}</b>${esc(supportCond(q))}</span>`).join("")}</dd>`;
  }).join("")}</dl>`;
}

/* ---------- gifts (section on the Learnsets tab) ---------- */
function giftsHTML(n){
  const g = [CHARS[n].gifts.love, CHARS[n].gifts.like];
  const rows = [0,1].filter(t=>g[t].length).map(t=>`<dt>${TIERS[t]}</dt><dd>${g[t].map(esc).join(", ")}</dd>`).join("");
  return rows ? `<dl class="gifts">${rows}</dl>` : `<p class="none">No gift data.</p>`;
}

/* ---------- learnsets panel ---------- */
// Stat line for a combat art or spell, skipping zero/empty values.
const STAT_FIELDS = [["cost","Cost"],["might","Mt"],["hit","Hit"],["crit","Crit"],["range","Rng"],["weight","Wt"],["uses","Uses"]];
const statLine = d => STAT_FIELDS.filter(([k])=>d[k] && d[k]!=="0").map(([k,l])=>`${l} ${d[k]}`).join(" · ");
function upgradeText(u){
  if(!u) return "";
  const s = statLine(u);
  return [s, u.description].filter(Boolean).join("; ");
}
function artHTML(name){
  const plus = (name.match(/\++$/)||[""])[0], base = name.slice(0, name.length-plus.length);
  const d = SKILLS[name] || SKILLS[base];
  const lines = [];
  if(lsDetails && d){
    if(d.type==="combatArt" || d.type==="spell"){ const s = statLine(d); if(s) lines.push(`<span class="st">${esc(s)}</span>`); }
    for(const t of [d.description, d.effect]) if(t) lines.push(esc(t));
    if(plus && !SKILLS[name] && d.type!=="combatArt") lines.push(`<span class="up">${plus.length>1?"Further upgraded":"Upgraded"} version: uses the higher value in brackets.</span>`);
    else if(d.upgrade) lines.push(`<span class="up">Upgraded (+): ${esc(upgradeText(d.upgrade))}</span>`);
  }
  const who = LEARNERS[base] || [];
  const rare = who.length && who.length<=RARE_MAX
    ? `<span class="tag rare" title="${esc(who.length===1?"Only this character learns it":`Learned by ${who.length} characters: ${who.join(", ")}`)}">Rare</span>` : "";
  return `<span class="art"><b>${esc(name)}</b>${rare}${lines.length?`<span class="ad">${lines.join("<br>")}</span>`:""}</span>`;
}
function personalHTML(type, names){
  return names.map(nm=>{
    const d = SKILLS[nm] || {}, desc = d.description || "No description in the sheet.";
    const label = nm.replace(/ \((Bloodmark|Ability|Spell|Combat Art)\)$/,"");
    const body = d.upgrade
      ? `<b>${esc(label)}</b><p><small>Base</small>${esc(desc)}</p><p><small>Upgraded</small>${esc(d.upgrade.description)}</p>`
      : `<b>${esc(label)}</b>${desc.split("\n").map(x=>`<p>${esc(x)}</p>`).join("")}`;
    return `<div class="pskill"><dt>${type}</dt><dd>${body}</dd></div>`;
  }).join("");
}
function recruitHTML(r){
  if(!r) return `<p class="na">Not recruitable</p>`;
  const when = r.part == null ? null : r.part === 3 ? `Part III, Section ${r.chapter}` : `${ROMAN[r.part]}, Chapter ${r.chapter}`;
  const items = [when, r.support!=null && `Support Lv ${r.support}`, r.renown!=null && `${r.renown} Renown`, ...r.notes].filter(Boolean);
  return items.length===1 ? `<p>${esc(items[0])}</p>` : `<ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
}

function renderLearn(){
  if(!CHARS[state.lsChar]) state.lsChar = ROSTER.find(n=>CHARS[n]) || "Leda";
  const n = state.lsChar, c = CHARS[n];
  const g = c.growthRates;
  const pers = personalHTML("Inherent", c.personalSkills.inherent) + personalHTML("Equippable", c.personalSkills.equippable)
    + personalHTML("Bloodmark", c.bloodmarks);
  const bb = k => c.boons.includes(k) ? "Boon" : c.banes.includes(k) ? "Bane" : "";
  const goals = (state.plans||{})[n]?.ranks || {};
  const skills = LINES.filter(([k])=>!lsBoonOnly || bb(k)==="Boon").map(([k,label])=>{
    const tag = bb(k) ? `<span class="tag ${bb(k).toLowerCase()}">${bb(k)}</span>` : "";
    const goal = goals[k] ? `<span class="goal" title="Planned rank">Plan ${esc(goals[k])}</span>` : "";
    const list = Object.entries(c.learnsets[k] || {});
    const hit = r => goals[k] && rankIdx(r) <= rankIdx(goals[k]) ? ` class="hit" title="Reached by the plan"` : "";
    const body = list.length ? `<dl class="ranks">${list.map(([r,a])=>`<dt${hit(r)}>${esc(r)}</dt><dd>${a.map(artHTML).join("")}</dd>`).join("")}</dl>` : `<p class="none">Can't learn this skill.</p>`;
    return `<div class="sk${bb(k)==="Boon"?" boon":""}"><h4>${label}${goal}${tag}</h4>${body}</div>`;}).join("");
  const paths = PATHS.map(([k,label])=>`<div class="path"><b>${label}</b>${recruitHTML(c.recruitment[k])}</div>`).join("");
  $("lsView").innerHTML = `
    <div class="lshead"><h2>${esc(n)}</h2>
      <div class="mtabs" role="tablist" aria-label="${esc(n)}">${[["info","Info"],["plan","Plan"]].map(([k,l])=>
        `<button type="button" role="tab" data-mtab="${k}" aria-selected="${lsMobileTab===k}" aria-controls="${k==="plan"?"lsPlan":"lsInfo"}">${l}</button>`).join("")}</div></div>
    <div id="lsInfo">
    <section class="lssec"><h3>Personal skills</h3><dl style="margin:0">${pers||'<p class="none">None listed.</p>'}</dl></section>
    <section class="lssec"><h3>Growth rates</h3>
      <div class="growth">${STATS.map(([k,s])=>`<span>${s}</span><div class="bar"><i style="width:${Math.min(g[k],100)}%"></i></div><em>${g[k]}%</em>`).join("")}</div>
      <p class="gtotal">Total <b>${g.total}%</b>, character growths before class and mount bonuses</p></section>
    <section class="lssec"><h3>Learnset<span class="segs"><span class="seg"><button type="button" data-boon="0" aria-pressed="${!lsBoonOnly}">All skills</button><button type="button" data-boon="1" aria-pressed="${lsBoonOnly}">Boons only</button></span><span class="seg"><button type="button" data-det="1" aria-pressed="${lsDetails}">Details</button><button type="button" data-det="0" aria-pressed="${!lsDetails}">Names</button></span></span></h3>
      <div class="skills">${skills || '<p class="none">No boon skills.</p>'}</div></section>
    <section class="lssec"><h3>Supports<small class="hint" style="margin:0">${Object.keys(c.supports||{}).length} partners</small></h3>${supportsHTML(n)}</section>
    <section class="lssec"><h3>Gifts</h3>${giftsHTML(n)}</section>
    <section class="lssec"><h3>Recruitment</h3><div class="paths">${paths}</div></section>
    </div>`;
  document.querySelector(".layout").dataset.mtab = lsMobileTab;
  renderPlan();
}

/* ---------- unit planner ---------- */
// Arts the unit picks up by reaching the planned rank in each line.
function plannedArts(c, ranks){
  return LINES.filter(([k])=>ranks[k]).map(([k,label])=>{
    const arts = Object.entries(c.learnsets[k]||{}).filter(([r])=>rankIdx(r)<=rankIdx(ranks[k])).flatMap(([,a])=>a);
    return {k, label, arts};
  });
}
function renderPlan(){
  const n = state.lsChar, c = CHARS[n], p = (state.plans||{})[n] || {ranks:{},classes:[]};
  const ranks = p.ranks || {}, classes = p.classes || [];
  const bb = k => c.boons.includes(k) ? "boon" : c.banes.includes(k) ? "bane" : "";
  const got = Object.fromEntries(plannedArts(c, ranks).map(x=>[x.k, x.arts]));
  const lvls = LINES.map(([k,label])=>{
    const learnable = Object.keys(c.learnsets[k]||{}).length > 0;
    const count = (got[k]||[]).length;
    const kind = bb(k);
    return `<label for="pr-${k}" class="${learnable?"":"off"}"${learnable?"":` title="${esc(n)} has no learnset in ${label}"`}>
        <i class="${kind}"${kind?` title="${kind==="boon"?"Boon":"Bane"}"`:""}></i>${label}</label>
      <select id="pr-${k}" data-rank="${k}" aria-label="${esc(label)} target rank">
        <option value="">–</option>${RANKS.map(r=>`<option${ranks[k]===r?" selected":""}>${r}</option>`).join("")}</select>
      <em class="${count?"has":""}">${ranks[k] ? (learnable ? `${count} ${count===1?"art":"arts"}` : "none") : ""}</em>`;
  }).join("");
  const byName = Object.fromEntries(CLASSES.map(x=>[x.name,x]));
  const chip = q => meets(q, ranks)
    ? `<span class="req ok" title="Met by the plan">✓ ${LINE_LABEL[q.line]} ${q.rank}</span>`
    : `<button type="button" class="req" data-raise="${q.line}:${q.rank}" title="Raise ${LINE_LABEL[q.line]} to ${q.rank} in the plan">${LINE_LABEL[q.line]} ${q.rank}</button>`;
  const reqHTML = cl => {
    if(!cl) return `<span>Not in the class data.</span>`;
    const gate = [cl.tier, cl.level && `Lv ${cl.level}`, cl.renown && `Renown ${cl.renown}`, cl.partThree && "Part III"].filter(Boolean).join(" · ");
    const prim = (cl.primary||[]).map(chip).join("");
    const sec = (cl.secondary||[]).map(chip).join("");
    const met = skillsMet(cl, ranks);
    return `${gate?`<span>${esc(gate)}</span>`:""}
      ${prim||sec ? `<div class="reqs${met?" met":""}">${prim}${sec?`${prim?`<em>and one of</em>`:`<em>One of</em>`}${sec}`:""}</div>` : `<span>No skill requirements.</span>`}
      ${(cl.notes||[]).map(t=>`<span class="note">${esc(t)}</span>`).join("")}
      ${cl.mastery?`<span title="${esc(cl.mastery.description||"")}">Mastery: ${esc(cl.mastery.name)}</span>`:""}`;
  };
  const clsRows = classes.map((nm,i)=>{
    const cl = byName[nm], ok = cl && skillsMet(cl, ranks);
    return `<li><div><b>${esc(nm)}${cl?` <i class="st ${ok?"ok":"no"}">${ok?"Skills met":"Needs skills"}</i>`:""}</b>${reqHTML(cl)}</div>
      <div class="clsbtns">
        <button type="button" data-cls-move="${i}:-1" aria-label="Move ${esc(nm)} earlier"${i===0?" disabled":""}>↑</button>
        <button type="button" data-cls-move="${i}:1" aria-label="Move ${esc(nm)} later"${i===classes.length-1?" disabled":""}>↓</button>
        <button type="button" data-cls-rm="${i}" aria-label="Remove ${esc(nm)}">×</button>
      </div></li>`;
  }).join("");
  const tiers = [...new Set(CLASSES.map(x=>x.tier||"Starting"))];
  const options = tiers.map(t=>{
    const opts = CLASSES.filter(x=>(x.tier||"Starting")===t && !classes.includes(x.name))
      .map(x=>`<option value="${esc(x.name)}">${esc(x.name)}${skillsMet(x, ranks)?" ✓":""}</option>`).join("");
    return opts ? `<optgroup label="${esc(t)}">${opts}</optgroup>` : "";
  }).join("");
  const arts = plannedArts(c, ranks).filter(x=>x.arts.length);
  const total = arts.reduce((s,x)=>s+x.arts.length,0);
  const el = $("lsPlan");
  el.innerHTML = `
    <h2>Plan for ${esc(n)}</h2>
    <p class="hint" style="margin:2px 0 0">Saved in this browser.</p>
    <h3>Skill levels <small>target rank</small></h3>
    <div class="lvls">${lvls}</div>
    <p class="legend"><span><i class="boon"></i>Boon</span><span><i class="bane"></i>Bane</span></p>
    <h3>Classes <small>${classes.length ? `${classes.length} planned` : "in order"}</small></h3>
    ${classes.length?`<ol class="clslist">${clsRows}</ol>`:""}
    <select id="planAddCls" aria-label="Add a class to the plan"><option value="">Add a class… (✓ = skills met)</option>${options}</select>
    ${total?`<h3>Arts from the plan <small>${total}</small></h3>
      <div class="planarts">${arts.map(x=>`<div><b>${x.label}:</b> ${x.arts.map(esc).join(", ")}</div>`).join("")}</div>`:""}
    ${isEmptyPlan(p)?"":`<button type="button" class="clear" data-plan-clear>Clear plan</button>`}`;
}
function updatePlan(fn, focusSel){
  const n = state.lsChar, p = plan(n);
  fn(p);
  if(isEmptyPlan(p)) delete state.plans[n];
  save(); renderLearn();
  if(focusSel){ const f = document.querySelector(focusSel); if(f) f.focus(); }
}

/* ---------- route tabs + recruit sidebar ---------- */
// Part I recruits on the route, by renown then support level. Lords and automatic joins have neither, so they lead.
function partOneRecruits(route){
  return NAMES.map(n=>({n, r:CHARS[n].recruitment[route]})).filter(x=>x.r && x.r.part===1)
    .sort((a,b)=>(a.r.renown??0)-(b.r.renown??0) || (a.r.support??0)-(b.r.support??0) || a.r.chapter-b.r.chapter || a.n.localeCompare(b.n));
}
function renderRoutes(){
  if(!PATHS.some(([k])=>k===state.route)) state.route = "cai";
  $("routes").innerHTML = PATHS.map(([k])=>{
    const lord = k[0].toUpperCase()+k.slice(1);
    return `<button role="tab" type="button" data-route="${k}" aria-selected="${state.route===k}">${lord}</button>`;
  }).join("");
  const current = state.lsChar;
  const recruits = partOneRecruits(state.route), recruitOf = Object.fromEntries(recruits.map(x=>[x.n,x.r]));
  const q = sideQuery().toLowerCase();
  let names;
  if(q){
    // Every character whose name matches, by name; spelling aliases (e.g. Lillian) count too.
    names = NAMES.filter(n=>n.toLowerCase().includes(q) || LOOKUP[norm(q)]===n);
  } else {
    // Part I recruits on the route: roster members first; both groups keep the renown/support order.
    names = [...recruits.filter(x=>ROSTER.includes(x.n)), ...recruits.filter(x=>!ROSTER.includes(x.n))].map(x=>x.n);
  }
  $("sideMsg").hidden = !(q && !names.length);
  $("sideMsg").textContent = q && !names.length ? `No character matches "${sideQuery()}".` : "";
  $("recruits").innerHTML = names.map(n=> recruitOf[n] ? recruitRow(n, recruitOf[n], current) : otherRow(n, current)).join("");
}
function recruitRow(n, r, current){
  const auto = joinsAutomatically(r);
  const meta = [`Ch ${r.chapter}`, r.support!=null && `Support ${r.support}`, r.renown!=null && `${r.renown} renown`].filter(Boolean).join(" · ");
  const inR = ROSTER.includes(n);
  const toggle = auto ? "" : `<button type="button" class="toggle" data-toggle="${esc(n)}" aria-pressed="${inR}"
    aria-label="${inR?"Remove":"Add"} ${esc(n)} ${inR?"from":"to"} the roster">${inR?"×":"+"}</button>`;
  return `<li><button type="button" class="open" data-open="${esc(n)}" aria-current="${current===n}" title="${esc(r.notes.join("\n"))}">
    <i style="${inR?`background:${color(n)}`:""}"></i><b>${esc(n)}</b><span>${esc(auto?meta+" · joins automatically":meta)}</span></button>${toggle}</li>`;
}
// A search result that isn't a Part I recruit on this route: says when (or whether) they join instead.
function otherRow(n, current){
  const r = CHARS[n].recruitment[state.route];
  const when = !r ? "Not recruitable on this route" : r.part==null ? "Recruitable on this route"
    : r.part===3 ? `Part III · Section ${r.chapter}` : `${ROMAN[r.part]} · Ch ${r.chapter}`;
  return `<li><button type="button" class="open" data-open="${esc(n)}" aria-current="${current===n}"${r&&r.notes.length?` title="${esc(r.notes.join("\n"))}"`:""}>
    <i></i><b>${esc(n)}</b><span>${esc(when)}</span></button></li>`;
}
const sideQuery = () => $("sideQ").value.trim();

function render(){
  buildRoster();
  renderRoutes();
  renderLearn();
}

$("routes").addEventListener("click", e=>{
  const b = e.target.closest("[data-route]"); if(b){ state.route = b.dataset.route; save(); render(); }
});
$("sideQ").addEventListener("input", renderRoutes);
$("sideQ").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ const first = $("recruits").querySelector("[data-open]"); if(first){ state.lsChar = first.dataset.open; save(); render(); } }
  else if(e.key==="Escape" && e.target.value){ e.target.value = ""; renderRoutes(); }
});
$("recruits").addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]"); if(t){ toggleRoster(t.dataset.toggle); return; }
  const b = e.target.closest("[data-open]"); if(b){ state.lsChar = b.dataset.open; save(); render(); }
});
$("panel-learn").addEventListener("click", e=>{
  const q = e.target.closest("[data-ls]");
  if(q){ const fromSupports = !!q.closest(".sups"); state.lsChar=q.dataset.ls; save(); render(); if(fromSupports) window.scrollTo({top:0}); return; }
  const b = e.target.closest("[data-boon]"); if(b){ lsBoonOnly = b.dataset.boon==="1"; renderLearn(); return; }
  const mt = e.target.closest("[data-mtab]"); if(mt){ lsMobileTab = mt.dataset.mtab; renderLearn(); document.querySelector(`[data-mtab="${lsMobileTab}"]`).focus(); return; }
  const dt = e.target.closest("[data-det]"); if(dt){ lsDetails = dt.dataset.det==="1"; renderLearn(); }
});
$("lsPlan").addEventListener("change", e=>{
  const r = e.target.closest("[data-rank]");
  if(r){ const k = r.dataset.rank, v = r.value; updatePlan(p=>{ if(v) p.ranks[k]=v; else delete p.ranks[k]; }, `#pr-${k}`); return; }
  if(e.target.id==="planAddCls" && e.target.value){ const v = e.target.value; updatePlan(p=>p.classes.push(v), "#planAddCls"); }
});
$("lsPlan").addEventListener("click", e=>{
  const rm = e.target.closest("[data-cls-rm]");
  if(rm){ const i = +rm.dataset.clsRm; updatePlan(p=>p.classes.splice(i,1), "#planAddCls"); return; }
  const up = e.target.closest("[data-raise]");
  if(up){
    const [k,r] = up.dataset.raise.split(":");
    updatePlan(p=>{ if(rankIdx(p.ranks[k]||"E") < rankIdx(r)) p.ranks[k] = r; }, `#pr-${k}`);
    return;
  }
  const mv = e.target.closest("[data-cls-move]");
  if(mv && !mv.disabled){
    const [i,d] = mv.dataset.clsMove.split(":").map(Number), j = i+d;
    updatePlan(p=>{ [p.classes[i],p.classes[j]] = [p.classes[j],p.classes[i]]; }, `[data-cls-move="${j}:${d}"]:not(:disabled), [data-cls-move="${j}:${-d}"]`);
    return;
  }
  if(e.target.closest("[data-plan-clear]") && confirm(`Clear the plan for ${state.lsChar}?`)) updatePlan(p=>{ p.ranks={}; p.classes=[]; }, "#pr-sword");
});

Promise.all(["data/characters.json","data/skills.json","data/classes.json"].map(u=>fetch(u).then(r=>{ if(!r.ok) throw new Error(u); return r.json(); })))
  .then(([chars, skills, classes])=>{
    CHARS = chars; SKILLS = skills;
    NAMES = Object.keys(CHARS).sort();
    for(const n of NAMES) for(const ranks of Object.values(CHARS[n].learnsets)) for(const arts of Object.values(ranks))
      for(const a of arts){ const b = a.replace(/\++$/,""), l = (LEARNERS[b] ||= []); if(!l.includes(n)) l.push(n); }
    LOOKUP = Object.fromEntries(NAMES.map(n=>[norm(n),n]));
    LOOKUP[norm("Lillian")] = "Lilian";
    CLASSES = Object.entries(classes).map(([name,v])=>({name, ...v}));
    try{
      const saved = JSON.parse(localStorage.getItem(KEY)||"null");
      if(saved && saved.added) state = {...state, ...saved};
    }catch(e){}
    render();
  })
  .catch(err=>{
    $("lsView").innerHTML = `<p class="msg">Couldn't load ${esc(err.message)}. Open this page through a web server rather than as a local file.</p>`;
  });
</script>
</body>
</html>

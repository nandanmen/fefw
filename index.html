<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fortune's Weave support planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8E3EE; --panel:#F7F5FA; --ink:#1F1C33; --muted:#625C7A; --line:#CFC7DD;
  --accent:#3B3486; --accent-ink:#FFFFFF; --warn:#9A3B2E; --boon:#2F7A5F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16152B; --panel:#211F3A; --ink:#EDEBF6; --muted:#A39EC0; --line:#37345C;
    --accent:#B1A6FF; --accent-ink:#16152B; --warn:#F09A86; --boon:#6FCFA6;
  }
}
:root[data-theme="dark"]{
  --bg:#16152B; --panel:#211F3A; --ink:#EDEBF6; --muted:#A39EC0; --line:#37345C;
  --accent:#B1A6FF; --accent-ink:#16152B; --warn:#F09A86; --boon:#6FCFA6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
.routes{display:flex;gap:4px;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:2;justify-content:center}
.routes button{border:0;background:none;color:var(--muted);padding:14px 16px;font-weight:600;white-space:nowrap;
  border-bottom:3px solid transparent;margin-bottom:-1px}
.routes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.layout{display:grid;grid-template-columns:250px minmax(0,680px);gap:8px 32px;justify-content:center;padding:0 16px}
.layout .wrap{margin:0;padding-left:0;padding-right:0}
.layout .wrap .tabs{margin-top:8px}
.side{position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow-y:auto;padding:20px 0 24px}
.side h2{font-size:1.35rem;margin:0}
.side .hint{margin:2px 0 10px}
.recruits{list-style:none;margin:0;padding:0}
.recruits li{display:flex;align-items:center;gap:4px;border-radius:8px}
.recruits li:hover{background:var(--panel)}
.recruits li:has([aria-current="true"]){background:var(--panel);box-shadow:inset 0 0 0 1px var(--accent)}
.recruits .open{display:grid;grid-template-columns:4px 1fr;gap:0 10px;flex:1;min-width:0;text-align:left;border:0;background:none;
  color:var(--ink);padding:7px 8px;border-radius:8px}
.recruits .toggle{flex:0 0 auto;width:30px;height:30px;margin-right:4px;border:1px solid var(--line);border-radius:50%;
  background:var(--bg);color:var(--ink);font-size:1.1rem;line-height:1;display:grid;place-items:center}
.recruits .toggle:hover{border-color:var(--accent);color:var(--accent)}
.recruits .toggle[aria-pressed="true"]{color:var(--muted)}
.recruits i{grid-row:span 2;border-radius:2px;background:transparent}
.recruits b{font-weight:600}
.recruits span{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:820px){
  .routes{justify-content:flex-start}
  .layout{grid-template-columns:minmax(0,1fr);padding:0}
  .layout .wrap{padding:8px 16px 48px}
  .side{position:static;max-height:none;padding:16px 16px 0}
  .recruits{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .recruits li{flex:0 0 auto;background:var(--panel);border:1px solid var(--line)}
  .recruits .open{flex:0 0 auto}
}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;font-weight:700;margin:0 0 10px;line-height:1.2}
input[type=text],input[type=search]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
::placeholder{color:var(--muted)}
button{font:inherit;cursor:pointer}
.hint{font-size:.875rem;color:var(--muted);margin:6px 0 0}
.hint a{color:var(--accent)}
.msg{font-size:.875rem;color:var(--warn);margin:6px 0 0}
.msg:empty{display:none}
.controls{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:12px;font-size:.9375rem}
.controls label{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.controls input{accent-color:var(--accent);width:18px;height:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:24px 0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 14px;font-weight:600;
  border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tier{margin:0 0 22px}
.tier h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;font-weight:700;margin:0 0 6px;
  padding-bottom:4px;border-bottom:1px solid var(--line)}
.tier h3 small{font-family:"Figtree",sans-serif;font-size:.8125rem;color:var(--muted);font-weight:500;margin-left:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.threads{display:flex;gap:3px;align-items:stretch;height:30px;min-width:4px}
.threads i{width:4px;border-radius:2px;display:block}
.who{min-width:0}
.who b{font-weight:600;display:block}
.who span{font-size:.875rem;color:var(--muted);display:block}
.who span span{display:inline}
.row .add{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;
  padding:6px 10px;font-size:.875rem;font-weight:500}
.row .add:hover{border-color:var(--accent);color:var(--accent)}
.row.member .who b::after{content:" (in roster)";font-weight:400;color:var(--muted);font-size:.8125rem}
.none{color:var(--muted)}
.gsearch{margin-bottom:18px}
.person{margin:0 0 18px}
.person h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.35rem;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.person h3 i{width:4px;height:18px;border-radius:2px;display:block}
dl.gifts{margin:0;display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;font-size:.9375rem}
dl.gifts dt{color:var(--muted);font-weight:500}
dl.gifts dd{margin:0}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.lspick{display:flex;gap:10px;align-items:center}
.lslabel{font-weight:600;color:var(--muted);font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em}
#lsChar{flex:1;min-width:0;font:inherit;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.quick button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:.875rem;font-weight:500}
.quick button i{width:4px;height:14px;border-radius:2px;display:block}
.quick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.lshead{margin:22px 0 4px}
.lshead h2{font-size:2rem;margin:0}
.lssec{margin:24px 0 0}
.lssec>h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.seg{font-family:"Figtree",sans-serif;font-size:.8125rem;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pskill{display:grid;grid-template-columns:6.5em 1fr;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.pskill:last-child{border-bottom:0}
.pskill dt{color:var(--muted);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.pskill dd{margin:0;min-width:0}
.pskill b{display:block}
.pskill p{margin:2px 0 4px;font-size:.9375rem}
.pskill small{color:var(--muted);font-weight:600;font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.growth{display:grid;grid-template-columns:3em 1fr 2.8em;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.growth span{font-size:.875rem;color:var(--muted);font-weight:600}
.growth .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.growth .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.growth em{font-style:normal;text-align:right;font-weight:600}
.gtotal{margin:8px 0 0;font-size:.875rem;color:var(--muted)}
.gtotal b{color:var(--ink)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.sk.boon{border-color:var(--boon)}
.sk h4{margin:0 0 8px;font-size:1rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.tag.boon{background:var(--boon);color:var(--accent-ink)}
.tag.bane{color:var(--warn);border:1px solid var(--warn)}
.ranks{display:grid;grid-template-columns:2.4em 1fr;gap:4px 10px;margin:0;font-size:.9375rem}
.ranks dt{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ranks dd{margin:0;min-width:0}
.sk .none{font-size:.9375rem;margin:0}
.paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.path{border-left:3px solid var(--line);padding:2px 0 2px 12px;min-width:0}
.path b{display:block;margin-bottom:2px}
.path ul{margin:0;padding-left:1.1em;font-size:.9375rem}
.path p{margin:0;font-size:.9375rem}
.path p.na{color:var(--muted)}
.segs{display:inline-flex;gap:6px;flex-wrap:wrap}
.art{display:block;margin:0 0 8px}
.art:last-child{margin-bottom:0}
.art b{font-weight:600}
.art .ad{display:block;font-size:.8125rem;line-height:1.45;color:var(--muted);margin-top:1px}
.art .st{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.art .up{font-style:italic}
.ranks dt{padding-top:1px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<nav class="routes" role="tablist" aria-label="Route" id="routes"></nav>
<div class="layout">
<aside class="side" aria-label="Part I recruits">
  <ol class="recruits" id="recruits"></ol>
</aside>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-supports" aria-controls="panel-supports" aria-selected="true">Support partners</button>
    <button role="tab" id="tab-gifts" aria-controls="panel-gifts" aria-selected="false">Gifts</button>
    <button role="tab" id="tab-learn" aria-controls="panel-learn" aria-selected="false">Learnsets</button>
  </div>

  <div id="panel-supports" role="tabpanel" aria-labelledby="tab-supports" aria-live="polite"></div>

  <div id="panel-gifts" role="tabpanel" aria-labelledby="tab-gifts" hidden>
    <input type="search" class="gsearch" id="gq" placeholder="Search a character or a gift, like Volcano Ghosh" aria-label="Search gifts">
    <div id="giftResults" aria-live="polite"></div>
  </div>

  <div id="panel-learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
    <div class="lspick">
      <label for="lsChar" class="lslabel">Character</label>
      <select id="lsChar"></select>
    </div>
    <div class="quick" id="lsQuick"></div>
    <div id="lsView"></div>
  </div>
</div>
</div>
<script>
const PALETTE = ["#C4566B","#D9A441","#3E8E7E","#5B6CD6","#B565C9","#E07A3F","#4FA3C7","#8BA33A","#D1608F","#7A6650","#2F6F9F","#C98A2B"];
const TIERS = ["Loved","Liked"];
const KEY = "fw-planner-v2";
const STATS = [["hp","HP"],["str","Str"],["mag","Mag"],["spd","Spd"],["dex","Dex"],["def","Def"],["res","Res"],["lck","Lck"],["cha","Cha"]];
const LINES = [["sword","Sword"],["spear","Spear"],["axe","Axe"],["bow","Bow"],["gauntlet","Gauntlet"],["blackMagic","Black Magic"],
  ["whiteMagic","White Magic"],["authority","Authority"],["infantry","Infantry"],["riding","Riding"],["armor","Armor"],["flying","Flying"]];
const PATHS = [["cai","Cai's path"],["dietrich","Dietrich's path"],["theodora","Theodora's path"],["leda","Leda's path"]];
const ROMAN = ["Prologue","Part I","Part II","Part III"];
const norm = s => s.toLowerCase().replace(/[^a-z]/g,"");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let CHARS = {}, SKILLS = {}, NAMES = [], LOOKUP = {};
let state = {added:{cai:[],dietrich:[],theodora:[],leda:[]}, showMembers:false, tab:"supports", route:"cai"};
// The roster for the current route: its automatic joiners plus anyone added from the sidebar. Rebuilt on each render.
let ROSTER = [];
let lsBoonOnly = false, lsDetails = true;
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };
const color = n => PALETTE[ROSTER.indexOf(n) % PALETTE.length];

const joinsAutomatically = r => r.renown==null && r.support==null;
function buildRoster(){
  const list = partOneRecruits(state.route);
  const added = (state.added[state.route] ||= []);
  ROSTER = list.filter(({n,r})=>joinsAutomatically(r) || added.includes(n)).map(x=>x.n);
}
function toggleRoster(n){
  const added = state.added[state.route];
  state.added[state.route] = added.includes(n) ? added.filter(m=>m!==n) : [...added, n];
  save(); render();
}

/* ---------- supports panel ---------- */
function renderSupports(){
  const r = ROSTER, el = $("panel-supports");
  const recruitable = new Set(partOneRecruits(state.route).map(x=>x.n));
  const toggle = `<div class="controls" style="margin:0 0 14px"><label><input type="checkbox" id="showMembers"${state.showMembers?" checked":""}> Show roster members in the list</label></div>`;
  const tally = {};
  for(const m of r) for(const p of Object.keys(CHARS[m].supports)) (tally[p] ||= []).push(m);
  const rows = Object.entries(tally)
    .filter(([n])=> state.showMembers || !r.includes(n))
    .map(([n,ms])=>({n, ms:ms.sort((a,b)=>r.indexOf(a)-r.indexOf(b))}))
    .sort((a,b)=> b.ms.length-a.ms.length || a.n.localeCompare(b.n));
  if(!rows.length){ el.innerHTML = toggle + `<p class="none">Nobody outside the roster has a support with these characters.</p>`; return; }
  const groups = {};
  rows.forEach(x=>(groups[x.ms.length] ||= []).push(x));
  // "Leda (C, B, A)": the ranks this pair can reach; hover shows each rank's requirements.
  const pair = (n,m) => {
    const ranks = CHARS[n].supports[m] || {};
    const tip = Object.entries(ranks).map(([rk,q])=>`${rk}: ${supportReq(q)}`).join("\n");
    return `<span title="${esc(tip)}">${esc(m)} (${Object.keys(ranks).join(", ")})</span>`;
  };
  el.innerHTML = toggle + Object.keys(groups).map(Number).sort((a,b)=>b-a).map(c=>`
    <div class="tier">
      <h3>Linked to ${c} of ${r.length}<small>${groups[c].length} ${groups[c].length===1?"character":"characters"}</small></h3>
      ${groups[c].map(({n,ms})=>{
        const member = r.includes(n);
        return `<div class="row${member?" member":""}">
          <div class="threads">${ms.map(m=>`<i style="background:${color(m)}" title="${esc(m)}"></i>`).join("")}</div>
          <div class="who"><b>${esc(n)}</b><span>with ${ms.map(m=>pair(n,m)).join(", ")}</span></div>
          ${member || !recruitable.has(n)?"<span></span>":`<button type="button" class="add" data-add="${esc(n)}">Add</button>`}
        </div>`;}).join("")}
    </div>`).join("");
}
function supportReq(q){
  const bits = [];
  if(q.support != null) bits.push(`Support Lv ${q.support}`);
  if(q.part != null) bits.push(ROMAN[q.part]);
  return bits.concat(q.notes).join(", ") || "No requirements listed";
}

/* ---------- gifts panel ---------- */
const gifts = n => [CHARS[n].gifts.love, CHARS[n].gifts.like];
const hasGifts = n => gifts(n).some(t=>t.length);
const itemHTML = (it,q) => {
  let t = esc(it);
  if(q){ const i = t.toLowerCase().indexOf(q.toLowerCase()); if(i>=0) t = t.slice(0,i)+"<mark>"+t.slice(i,i+q.length)+"</mark>"+t.slice(i+q.length); }
  return t;
};
const personHTML = (n,q) => {
  const g = gifts(n);
  const inR = ROSTER.includes(n);
  const rows = [0,1].filter(t=>g[t].length).map(t=>`<dt>${TIERS[t]}</dt><dd>${g[t].map(it=>itemHTML(it,q)).join(", ")}</dd>`).join("");
  return `<div class="person"><h3>${inR?`<i style="background:${color(n)}"></i>`:""}${esc(n)}</h3>${rows?`<dl class="gifts">${rows}</dl>`:`<p class="none">No gift data.</p>`}</div>`;
};

function renderGifts(){
  const q = $("gq").value.trim(), el = $("giftResults");
  const r = ROSTER;

  if(!q){
    if(!r.length){ el.innerHTML = `<p class="none">Search for a character or gift, or add characters to your roster to see their favourites.</p>`; return; }
    // gifts loved or liked across the roster
    const agg = {};
    for(const m of r){
      gifts(m).forEach((items,t)=>items.forEach(it=>{
        const a = (agg[norm(it)] ||= {label:it, who:{}});
        if(!(m in a.who) || a.who[m]>t) a.who[m]=t;
      }));
    }
    const top = Object.values(agg).map(a=>({...a, n:Object.keys(a.who).length, loved:Object.values(a.who).filter(t=>t===0).length}))
      .sort((a,b)=>b.n-a.n || b.loved-a.loved || a.label.localeCompare(b.label)).slice(0,12);
    const missing = r.filter(m=>!hasGifts(m));
    el.innerHTML = `
      <div class="tier"><h3>Gifts your roster likes most<small>loved or liked</small></h3>
      ${top.length ? top.map(a=>{
        const ms = r.filter(m=>m in a.who);
        return `<div class="row"><div class="threads">${ms.map(m=>`<i style="background:${color(m)};opacity:${a.who[m]===0?1:.45}" title="${esc(m)}: ${TIERS[a.who[m]]}"></i>`).join("")}</div>
          <div class="who"><b>${esc(a.label)}</b><span>${ms.map(m=>`${esc(m)}${a.who[m]===0?" (loved)":""}`).join(", ")}</span></div><span></span></div>`;}).join("")
        : `<p class="none">No gift data for anyone in the roster.</p>`}
      </div>
      <div class="tier"><h3>Roster members</h3>${r.filter(hasGifts).map(m=>personHTML(m,"")).join("")}
      ${missing.length?`<p class="hint">No gift data for ${missing.map(esc).join(", ")}.</p>`:""}</div>`;
    return;
  }

  const nm = LOOKUP[norm(q)];
  if(nm){ el.innerHTML = personHTML(nm,""); return; }

  const nq = q.toLowerCase();
  const byTier = [[],[]];
  for(const n of NAMES) gifts(n).forEach((items,t)=>{
    const hit = items.filter(it=>it.toLowerCase().includes(nq));
    if(hit.length) byTier[t].push({n,hit});
  });
  const nameHits = NAMES.filter(n=>n.toLowerCase().includes(nq) && hasGifts(n));
  let html = "";
  if(nameHits.length) html += nameHits.map(n=>personHTML(n,"")).join("");
  html += byTier.map((list,t)=>list.length?`<div class="tier"><h3>${TIERS[t]}<small>${list.length} ${list.length===1?"character":"characters"}</small></h3>
    ${list.sort((a,b)=>(ROSTER.includes(b.n)-ROSTER.includes(a.n))||a.n.localeCompare(b.n)).map(({n,hit})=>`<div class="row${ROSTER.includes(n)?" member":""}">
      <div class="threads">${ROSTER.includes(n)?`<i style="background:${color(n)}"></i>`:""}</div>
      <div class="who"><b>${esc(n)}</b><span>${hit.map(it=>itemHTML(it,q)).join(", ")}</span></div><span></span></div>`).join("")}</div>`:"").join("");
  el.innerHTML = html || `<p class="none">Nothing matches "${esc(q)}". Try part of the name, like "ghosh".</p>`;
}

/* ---------- learnsets panel ---------- */
// Stat line for a combat art or spell, skipping zero/empty values.
const STAT_FIELDS = [["cost","Cost"],["might","Mt"],["hit","Hit"],["crit","Crit"],["range","Rng"],["weight","Wt"],["uses","Uses"]];
const statLine = d => STAT_FIELDS.filter(([k])=>d[k] && d[k]!=="0").map(([k,l])=>`${l} ${d[k]}`).join(" · ");
function upgradeText(u){
  if(!u) return "";
  const s = statLine(u);
  return [s, u.description].filter(Boolean).join("; ");
}
function artHTML(name){
  const plus = (name.match(/\++$/)||[""])[0], base = name.slice(0, name.length-plus.length);
  const d = SKILLS[name] || SKILLS[base];
  const lines = [];
  if(lsDetails && d){
    if(d.type==="combatArt" || d.type==="spell"){ const s = statLine(d); if(s) lines.push(`<span class="st">${esc(s)}</span>`); }
    for(const t of [d.description, d.effect]) if(t) lines.push(esc(t));
    if(plus && !SKILLS[name] && d.type!=="combatArt") lines.push(`<span class="up">${plus.length>1?"Further upgraded":"Upgraded"} version: uses the higher value in brackets.</span>`);
    else if(d.upgrade) lines.push(`<span class="up">Upgraded (+): ${esc(upgradeText(d.upgrade))}</span>`);
  }
  return `<span class="art"><b>${esc(name)}</b>${lines.length?`<span class="ad">${lines.join("<br>")}</span>`:""}</span>`;
}
function personalHTML(type, names){
  return names.map(nm=>{
    const d = SKILLS[nm] || {}, desc = d.description || "No description in the sheet.";
    const label = nm.replace(/ \((Bloodmark|Ability|Spell|Combat Art)\)$/,"");
    const body = d.upgrade
      ? `<b>${esc(label)}</b><p><small>Base</small>${esc(desc)}</p><p><small>Upgraded</small>${esc(d.upgrade.description)}</p>`
      : `<b>${esc(label)}</b>${desc.split("\n").map(x=>`<p>${esc(x)}</p>`).join("")}`;
    return `<div class="pskill"><dt>${type}</dt><dd>${body}</dd></div>`;
  }).join("");
}
function recruitHTML(r){
  if(!r) return `<p class="na">Not recruitable</p>`;
  const when = r.part == null ? null : r.part === 3 ? `Part III, Section ${r.chapter}` : `${ROMAN[r.part]}, Chapter ${r.chapter}`;
  const items = [when, r.support!=null && `Support Lv ${r.support}`, r.renown!=null && `${r.renown} Renown`, ...r.notes].filter(Boolean);
  return items.length===1 ? `<p>${esc(items[0])}</p>` : `<ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
}

function renderLearn(){
  if(!CHARS[state.lsChar]) state.lsChar = ROSTER.find(n=>CHARS[n]) || "Leda";
  const n = state.lsChar, c = CHARS[n];
  $("lsChar").value = n;
  $("lsQuick").innerHTML = ROSTER.map(m=>`<button type="button" data-ls="${esc(m)}" aria-pressed="${m===n}"><i style="background:${color(m)}"></i>${esc(m)}</button>`).join("");
  const g = c.growthRates;
  const pers = personalHTML("Inherent", c.personalSkills.inherent) + personalHTML("Equippable", c.personalSkills.equippable)
    + personalHTML("Bloodmark", c.bloodmarks);
  const bb = k => c.boons.includes(k) ? "Boon" : c.banes.includes(k) ? "Bane" : "";
  const skills = LINES.filter(([k])=>!lsBoonOnly || bb(k)==="Boon").map(([k,label])=>{
    const tag = bb(k) ? `<span class="tag ${bb(k).toLowerCase()}">${bb(k)}</span>` : "";
    const list = Object.entries(c.learnsets[k] || {});
    const body = list.length ? `<dl class="ranks">${list.map(([r,a])=>`<dt>${esc(r)}</dt><dd>${a.map(artHTML).join("")}</dd>`).join("")}</dl>` : `<p class="none">Can't learn this skill.</p>`;
    return `<div class="sk${bb(k)==="Boon"?" boon":""}"><h4>${label}${tag}</h4>${body}</div>`;}).join("");
  const paths = PATHS.map(([k,label])=>`<div class="path"><b>${label}</b>${recruitHTML(c.recruitment[k])}</div>`).join("");
  $("lsView").innerHTML = `
    <div class="lshead"><h2>${esc(n)}</h2></div>
    <section class="lssec"><h3>Personal skills</h3><dl style="margin:0">${pers||'<p class="none">None listed.</p>'}</dl></section>
    <section class="lssec"><h3>Growth rates</h3>
      <div class="growth">${STATS.map(([k,s])=>`<span>${s}</span><div class="bar"><i style="width:${Math.min(g[k],100)}%"></i></div><em>${g[k]}%</em>`).join("")}</div>
      <p class="gtotal">Total <b>${g.total}%</b>, character growths before class and mount bonuses</p></section>
    <section class="lssec"><h3>Learnset<span class="segs"><span class="seg"><button type="button" data-boon="0" aria-pressed="${!lsBoonOnly}">All skills</button><button type="button" data-boon="1" aria-pressed="${lsBoonOnly}">Boons only</button></span><span class="seg"><button type="button" data-det="1" aria-pressed="${lsDetails}">Details</button><button type="button" data-det="0" aria-pressed="${!lsDetails}">Names</button></span></span></h3>
      <div class="skills">${skills || '<p class="none">No boon skills.</p>'}</div></section>
    <section class="lssec"><h3>Recruitment</h3><div class="paths">${paths}</div></section>`;
}

/* ---------- route tabs + recruit sidebar ---------- */
// Part I recruits on the route, by renown then support level. Lords and automatic joins have neither, so they lead.
function partOneRecruits(route){
  return NAMES.map(n=>({n, r:CHARS[n].recruitment[route]})).filter(x=>x.r && x.r.part===1)
    .sort((a,b)=>(a.r.renown??0)-(b.r.renown??0) || (a.r.support??0)-(b.r.support??0) || a.r.chapter-b.r.chapter || a.n.localeCompare(b.n));
}
function renderRoutes(){
  if(!PATHS.some(([k])=>k===state.route)) state.route = "cai";
  $("routes").innerHTML = PATHS.map(([k])=>{
    const lord = k[0].toUpperCase()+k.slice(1);
    return `<button role="tab" type="button" data-route="${k}" aria-selected="${state.route===k}">${lord}</button>`;
  }).join("");
  // Roster members first; both groups keep the renown/support order.
  const all = partOneRecruits(state.route);
  const list = [...all.filter(x=>ROSTER.includes(x.n)), ...all.filter(x=>!ROSTER.includes(x.n))];
  const current = state.tab==="learn" ? state.lsChar : null;
  $("recruits").innerHTML = list.map(({n,r})=>{
    const auto = joinsAutomatically(r);
    const meta = [`Ch ${r.chapter}`, r.support!=null && `Support ${r.support}`, r.renown!=null && `${r.renown} renown`].filter(Boolean).join(" · ");
    const inR = ROSTER.includes(n);
    const toggle = auto ? "" : `<button type="button" class="toggle" data-toggle="${esc(n)}" aria-pressed="${inR}"
      aria-label="${inR?"Remove":"Add"} ${esc(n)} ${inR?"from":"to"} the roster">${inR?"×":"+"}</button>`;
    return `<li><button type="button" class="open" data-open="${esc(n)}" aria-current="${current===n}" title="${esc(r.notes.join("\n"))}">
      <i style="${inR?`background:${color(n)}`:""}"></i><b>${esc(n)}</b><span>${esc(auto?meta+" · joins automatically":meta)}</span></button>${toggle}</li>`;
  }).join("");
}

function render(){
  buildRoster();
  renderRoutes();
  const tab = ["gifts","learn"].includes(state.tab) ? state.tab : "supports";
  for(const k of ["supports","gifts","learn"]){ $("tab-"+k).setAttribute("aria-selected", tab===k); $("panel-"+k).hidden = tab!==k; }
  if(tab==="supports") renderSupports(); else if(tab==="gifts") renderGifts(); else renderLearn();
}

document.addEventListener("click", e=>{
  const ad = e.target.closest("[data-add]");
  if(ad) toggleRoster(ad.dataset.add);
});
document.addEventListener("change", e=>{
  if(e.target.id==="showMembers"){ state.showMembers=e.target.checked; save(); render(); }
});
for(const k of ["supports","gifts","learn"]) $("tab-"+k).addEventListener("click", ()=>{ state.tab=k; save(); render(); });
$("gq").addEventListener("input", renderGifts);
$("routes").addEventListener("click", e=>{
  const b = e.target.closest("[data-route]"); if(b){ state.route = b.dataset.route; save(); render(); }
});
$("recruits").addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]"); if(t){ toggleRoster(t.dataset.toggle); return; }
  const b = e.target.closest("[data-open]"); if(b){ state.tab = "learn"; state.lsChar = b.dataset.open; save(); render(); }
});
$("lsChar").addEventListener("change", e=>{ state.lsChar=e.target.value; save(); render(); });
$("panel-learn").addEventListener("click", e=>{
  const q = e.target.closest("[data-ls]"); if(q){ state.lsChar=q.dataset.ls; save(); render(); return; }
  const b = e.target.closest("[data-boon]"); if(b){ lsBoonOnly = b.dataset.boon==="1"; renderLearn(); return; }
  const dt = e.target.closest("[data-det]"); if(dt){ lsDetails = dt.dataset.det==="1"; renderLearn(); }
});

Promise.all(["data/characters.json","data/skills.json"].map(u=>fetch(u).then(r=>{ if(!r.ok) throw new Error(u); return r.json(); })))
  .then(([chars, skills])=>{
    CHARS = chars; SKILLS = skills;
    NAMES = Object.keys(CHARS).sort();
    LOOKUP = Object.fromEntries(NAMES.map(n=>[norm(n),n]));
    LOOKUP[norm("Lillian")] = "Lilian";
    try{
      const saved = JSON.parse(localStorage.getItem(KEY)||"null");
      if(saved && saved.added) state = {...state, ...saved};
    }catch(e){}
    $("lsChar").innerHTML = NAMES.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
    render();
  })
  .catch(err=>{
    $("panel-supports").innerHTML = `<p class="msg">Couldn't load ${esc(err.message)}. Open this page through a web server rather than as a local file.</p>`;
  });
</script>
</body>
</html>
